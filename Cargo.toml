[package]
name = "plainlist"
authors = ["Marvin Lücke"]
description = "Manage music playlists in a plain text format"
readme = "README.md"
homepage = "https://github.com/lueckem/plainlist"
repository = "https://github.com/lueckem/plainlist"
categories = ["command-line-utilities", "multimedia", "multimedia::audio"]
keywords = ["audio", "playlist", "metadata"]
license = "MIT"
edition = "2024"
version = "0.1.0"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
lofty = "0.24.0"
pathdiff = "0.2.3"
rayon = "1.12.0"
regex = "1.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
rstest = "0.26.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
